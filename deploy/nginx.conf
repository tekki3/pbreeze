# Include inside Nginx's http block. Configure HTTPS separately before production.
# Replace the hostname, public path, and FPM endpoint.
server {
    listen 80;
    server_name pbreeze.example.com;
    root /srv/pbreeze/public;
    index index.php;
    autoindex off;
    client_max_body_size 8m;

    location ~ (^|/)\. {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 330s;
    }

    location ~* \.(php[0-9]?|phtml|phar)(/|$) {
        return 404;
    }

    location ~* \.(env|sqlite[0-9]?|log|ini|config|sql|bak)$ {
        return 404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        try_files $uri /index.php$is_args$args;
    }

    location / {
        rewrite ^ /index.php last;
    }
}
