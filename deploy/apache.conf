# Apache 2.4+, with mod_rewrite, mod_proxy, mod_proxy_fcgi and PHP-FPM.
# Replace the hostname, public path, and FPM endpoint. Configure HTTPS separately.
# On Windows use forward slashes and a TCP FastCGI endpoint, not a Unix socket.
<VirtualHost *:80>
    ServerName pbreeze.example.com
    DocumentRoot "/srv/pbreeze/public"

    <Directory "/srv/pbreeze/public">
        Require all granted
        AllowOverride All
        Options -Indexes -MultiViews
        DirectoryIndex index.php
        CGIPassAuth On
        <Files "index.php">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
        </Files>
    </Directory>

    # Allow framework JSON limits and 2 MiB file uploads plus multipart overhead.
    # Coordinate with post_max_size/upload_max_filesize and application limits.
    LimitRequestBody 8388608
</VirtualHost>
