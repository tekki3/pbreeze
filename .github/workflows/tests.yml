name: PHP tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.3', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, curl, iconv, mbstring, zip, dom, intl, fileinfo
          coverage: none
          tools: none
      - name: Run native tests
        run: php breeze test

  web-servers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [apache, nginx]
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, intl, mbstring, fileinfo
          coverage: none
          tools: none
      - name: Install web server and matching PHP-FPM
        run: |
          sudo apt-get update
          if [ "${{ matrix.server }}" = apache ]; then package=apache2; else package=nginx; fi
          sudo apt-get install -y "$package" php${{ matrix.php }}-fpm
      - name: Run real web-server integration
        run: php tests/web-server-integration.php ${{ matrix.server }}

  frankenphp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, openssl, intl, mbstring, fileinfo
          coverage: none
          tools: none
      - name: Install checksum-verified FrankenPHP
        run: |
          curl -fL -o "$RUNNER_TEMP/frankenphp" https://github.com/php/frankenphp/releases/download/v1.13.5/frankenphp-linux-x86_64
          echo "52d262be9b107a1a6f5f1d2945393dd838e89e4735c38a376b940e9fa9e1c881  $RUNNER_TEMP/frankenphp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/frankenphp"
      - name: Run standard-mode FrankenPHP integration
        run: FRANKENPHP_BINARY="$RUNNER_TEMP/frankenphp" php tests/web-server-integration.php frankenphp

  iis:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, intl, mbstring, fileinfo
          coverage: none
          tools: none
        env:
          phpts: nts
      - name: Enable IIS FastCGI and install Microsoft URL Rewrite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-WindowsFeature Web-Server, Web-CGI, Web-Scripting-Tools -IncludeManagementTools
          $installer = Join-Path $env:RUNNER_TEMP 'pbreeze-url-rewrite.msi'
          Invoke-WebRequest 'https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_en-US.msi' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Microsoft URL Rewrite installer signature is not valid.'
          }
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "URL Rewrite installation failed: $($process.ExitCode)" }
          Start-Service W3SVC
      - name: Run IIS FastCGI integration
        shell: powershell
        run: ./tests/web-server-iis.ps1

  cache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, memcached, intl
          coverage: none
          tools: none
      - name: Test Redis cache
        run: php tests/cache-integration.php
        env:
          CACHE_TEST_DRIVER: redis
      - name: Test Memcached cache
        run: php tests/cache-integration.php
        env:
          CACHE_TEST_DRIVER: memcached

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pbreeze_test_ci
          MYSQL_ROOT_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -plocal-ci-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, intl
          coverage: none
          tools: none
      - name: Run MySQL integration tests
        run: php tests/mysql-integration.php
        env:
          MYSQL_TEST_DATABASE: pbreeze_test_ci
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: local-ci-only
          MYSQL_TEST_TLS: disabled
          MYSQL_TEST_ALLOW_DESTRUCTIVE: 'true'

  postgresql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbreeze_test_ci
          POSTGRES_USER: pbreeze
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbreeze -d pbreeze_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, openssl, intl
          coverage: none
          tools: none
      - name: Run PostgreSQL integration tests
        run: php tests/pgsql-integration.php
        env:
          PGSQL_TEST_DATABASE: pbreeze_test_ci
          PGSQL_TEST_HOST: 127.0.0.1
          PGSQL_TEST_PORT: '5432'
          PGSQL_TEST_USERNAME: pbreeze
          PGSQL_TEST_PASSWORD: local-ci-only
          PGSQL_TEST_SSLMODE: disable
          PGSQL_TEST_ALLOW_DESTRUCTIVE: 'true'
